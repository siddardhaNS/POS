services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tiffin
      POSTGRES_PASSWORD: tiffin
      POSTGRES_DB: tiffin
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiffin"]
      interval: 3s
      retries: 20
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://tiffin:tiffin@db:5432/tiffin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@tiffin.app}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-admin12345}
      CORS_ORIGINS: http://localhost:3100,http://localhost:3000
      SEED_DEMO: "true"
    ports: ["8010:8000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
